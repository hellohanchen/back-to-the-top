<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Back to the Top</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><a class="skip" href="#main">Skip to charts</a><header><a class="brand" href="/" aria-label="Back to the Top"><img src="/icon.svg" alt="" width="38" height="44"><span>BACK TO<br>THE TOP</span></a><div class="range"><label class="sr-only" for="range">Time range</label><select id="range"><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="all">All history</option><option value="custom">Custom range</option></select><div id="custom" hidden><input type="date" id="start" aria-label="Start date"><span>—</span><input type="date" id="end" aria-label="End date"></div><span id="range-label"></span><span class="timezone">EST · UTC−5</span></div></header><main id="main"><div id="notice" role="status" hidden></div><section><h1>SALES VOLUME <span>USD</span></h1><div class="panel"><div id="volume-chart" class="chart" role="img" aria-label="Daily sales volume stacked by Moments offers, Moments listings and Packs listings"></div></div></section><section><h2>MOMENTS</h2><div class="grid"><article class="panel"><h3>Sales count</h3><div id="sales-chart" class="chart" role="img" aria-label="Daily Moment sales count"></div></article><article class="panel"><h3>Median price <span>USD</span></h3><div id="median-chart" class="chart" role="img" aria-label="Daily median Moment price"></div></article><article class="panel"><h3>Average price <span>USD</span></h3><div id="average-chart" class="chart" role="img" aria-label="Daily average Moment price"></div></article><article class="panel"><h3>Highest price <span>USD</span></h3><div id="highest-chart" class="chart" role="img" aria-label="Daily highest Moment price"></div></article></div></section><section><h2>ACTIVITY <span>UNIQUE ADDRESSES</span></h2><div class="panel"><div id="users-chart" class="chart" role="img" aria-label="Daily active users, buyers and sellers"></div></div></section><footer id="updated"></footer></main></body></html>
