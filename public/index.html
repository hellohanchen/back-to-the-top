<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Back to the Top</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><a class="skip" href="#main">Skip to charts</a><header><a class="brand" href="/" aria-label="Back to the Top"><img src="/icon.svg" alt="" width="38" height="44"><span>Back to the Top</span></a><div class="range"><input id="range" type="hidden" value="7"><div class="range-buttons" role="group" aria-label="Time range"><button data-range="7" aria-pressed="true">7D</button><button data-range="30" aria-pressed="false">30D</button><button data-range="all" aria-pressed="false">All</button><button data-range="custom" aria-pressed="false">Custom</button></div><div id="custom" hidden><input type="date" id="start" aria-label="Start date"><span>—</span><input type="date" id="end" aria-label="End date"></div><span id="range-label"></span><span class="timezone">EST · UTC−5</span></div></header><main id="main"><div id="notice" role="status" hidden></div><div class="grid overview"><section><h1>Sales volume <span>USD</span></h1><div class="panel"><div id="volume-chart" class="chart" role="img" aria-label="Daily sales volume stacked by Moments offers, Moments listings and Packs listings"></div></div></section><section><h2>Activity <span>Unique addresses</span></h2><div class="panel"><div id="users-chart" class="chart" role="img" aria-label="Daily active users, buyers and sellers"></div></div></section></div><section><h2>Moments</h2><div class="grid"><article class="panel"><h3>Sales count</h3><div id="sales-chart" class="chart" role="img" aria-label="Daily Moment sales count"></div></article><article class="panel"><h3>Median price <span>USD</span></h3><div id="median-chart" class="chart" role="img" aria-label="Daily median Moment price"></div></article><article class="panel"><h3>Average price <span>USD</span></h3><div id="average-chart" class="chart" role="img" aria-label="Daily average Moment price"></div></article><article class="panel"><h3>Highest price <span>USD</span></h3><div id="highest-chart" class="chart" role="img" aria-label="Daily highest Moment price"></div></article></div></section><section class="calendar-section"><div class="calendar-heading"><h2>Daily top Moment</h2><label><span class="sr-only">Calendar month</span><input id="calendar-month" type="month" aria-label="Calendar month"></label></div><div class="calendar-week" aria-hidden="true"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div><div id="calendar" class="calendar"></div></section><footer id="updated"></footer></main></body></html>
