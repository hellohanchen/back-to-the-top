name: NBA cloud feed probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nba-cloud-feed-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install nba_api==1.12.0
      - name: Probe current scoreboard and every started game
        run: python scripts/probe-nba.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-cloud-feed-probe
          path: nba-probe-results/
          retention-days: 7
          if-no-files-found: ignore
