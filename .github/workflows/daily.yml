name: Daily market data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/data/**']
permissions:
  contents: read
concurrency:
  group: daily-market-data
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed snapshot without upstream requests
        run: python3 -m collector.validate_snapshot
      - name: Publish and verify hosted dataset
        env:
          SITE_URL: https://back-to-the-top-han.han110656.chatgpt.site
          DATA_WRITE_KEY: ${{ secrets.DATA_WRITE_KEY }}
          SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
        run: python3 scripts/publish-data.py

  pages:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  cloudflare:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/cloudflare.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
